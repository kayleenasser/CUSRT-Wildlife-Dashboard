name: Refresh collision data

on:
  schedule:
    # Hourly at :17. GitHub delays or drops scheduled runs when it's busy, and the top of the hour is busiest.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull Calgary reports from BirdMapper
        run: python scripts/build_data.py
      - name: Commit if changed
        run: |
          if git diff --quiet data/collisions.json; then
            echo "No changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
            git add data/collisions.json
            git commit -m "Refresh collision data"
            git push
          fi
